<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceLink - محاكاة شبكات الفضاء</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpaceLink: محاكاة الاتصالات الفضائية (CN453)</h1>
            <p>محاكاة التأخير، نوافذ الاتصال، وتقنية التخزين وإعادة التوجيه (Store & Forward)</p>
        </header>

        <div class="control-panel">
            <h3>إعدادات المهمة</h3>
            <div class="input-group">
                <label for="msgRange">عدد الرسائل: <span id="msgCountVal">12</span></label>
                <input type="range" id="msgRange" min="5" max="30" value="12">
            </div>
            <button id="runBtn">تشغيل المحاكاة (Run Simulation)</button>
        </div>

        <div class="results-panel">
            <div class="card">
                <h3>الإرسال المباشر (Direct Only)</h3>
                <p>الرسائل المسلمة: <span id="directDelivered">--</span></p>
                <p>متوسط التأخير: <span id="directDelay">--</span> دقيقة</p>
            </div>
            <div class="card">
                <h3>التخزين والإعادة (Store & Forward)</h3>
                <p>الرسائل المسلمة: <span id="dtnDelivered">--</span></p>
                <p>متوسط التأخير: <span id="dtnDelay">--</span> دقيقة</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
